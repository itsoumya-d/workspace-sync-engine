[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workspace-sync-engine"
version = "0.1.0"
description = "High-throughput real-time collaborative workspace state engine in async Python with CDC outbox and audit trails."
readme = "README.md"
authors = [
    { name = "Soumya Debnath", email = "soumyadebnath1619@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
